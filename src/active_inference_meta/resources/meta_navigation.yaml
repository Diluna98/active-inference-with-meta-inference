grid:
  columns: 20
  rows: 20
  width: 7.0
  height: 7.0
  origin_x: 0.0
  origin_y: 0.0
frame:
  arena_x_from_odom: "-y"
  arena_y_from_odom: "+x"
  odom_zero_arena_x: 0.175
  odom_zero_arena_y: 0.175
topics:
  odom: /tb4_08/odom
  rssi: /tb4_08/rssi
  cmd_vel: /tb4_08/cmd_vel
sensors:
  rssi_median_window: 5
  odom_timeout: 2.0
  rssi_timeout: 2.0
motion:
  linear_speed: 0.15
  angular_speed: 0.3
  position_tolerance: 0.02
  yaw_tolerance: 0.03
  control_period: 0.05
  action_timeout: 30.0
  # Restore a repeatable antenna orientation before the next RSSI observation.
  final_heading: positive_x
  # At about 1 RSSI packet/s, this replaces the complete five-sample window.
  settling_time: 6.0
active_inference:
  goal_resolution: 2
  temporal_horizon: 3
  message_passing_iterations: 10
  policy_samples: 500
  exact_state_limit: 1
  random_seed: 7
  policy_workers: 1
  normalized_signal_preference: true
meta_inference:
  enabled: true
  initial_resolution: 2
  fixed_resolution:
  candidate_resolutions: [2, 5, 10, 20]
  # Fixed likelihood-only reference used for the paper's RSSI Fisher information.
  information_reference_resolution: 20
  meta_interval: 3
profiling:
  enabled: false
  output: meta_profile.csv
experiment_logging:
  enabled: true
  output_directory: experiment_runs
  filename_prefix: robot_run
  run_label: ""
  cpu_condition: uncontrolled
  # Matches the first-passage success threshold reported in Table I.
  success_distance_m: 0.5
visualization:
  enabled: true
  mode: dashboard
  refresh_steps: 1
  clear_terminal: true
  output: goal_belief.png
  host: 0.0.0.0
  port: 8000
  history_limit: 500
meta_agent:
  message_passing_iterations: 30
  policy_samples: 500
  exact_state_limit: 4096
  random_seed: 0
  policy_workers: 1
  learning_A: true
  learning_rate: 0.1
  forgetting_rate: 0.95
meta_learning:
  checkpoint: learned_meta_likelihood.yaml
  load_if_available: true
  save_on_exit: true
meta_preferences:
  error_base_weight: 20.0
  error_context_weight: 15.0
  context_gate_center: 0.45
  context_gate_steepness: 6.0
  latency_comfort_ms: 600.0
  latency_deadline_ms: 800.0
  latency_linear_weight: 1.0
  latency_excess_weight: 2.0
meta_observation_bounds:
  information_gain_proxy: [0.0, 0.5]
  prediction_error: [20.0, 35.0]
  inference_latency_ms: [50.0, 9000.0]
  cpu_availability: [0.0, 100.0]
meta_likelihood:
  mu_information: [0.0281, 0.176, 0.2062, 0.3272]
  sigma_information: [0.015, 0.0307, 0.0302, 0.040]
