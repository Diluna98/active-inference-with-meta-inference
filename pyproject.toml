[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "active-inference-with-meta-inference"
version = "0.1.2"
description = "Hierarchical active inference for adaptive model representation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diluna A. Warnakulasuriya" }]
keywords = [
  "active-inference",
  "meta-inference",
  "model-selection",
  "bounded-rationality",
  "robotics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "active-inference-navigation-agent @ https://github.com/Diluna98/active-inference-navigation-agent/archive/refs/tags/v0.2.1.zip",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pillow>=10.0",
  "psutil>=5.9",
  "scipy>=1.10",
  "pyaif-toolkit>=0.2,<0.3",
]

[project.scripts]
active-inference-meta = "active_inference_meta.cli:main"
active-inference-meta-navigation = "active_inference_meta.adaptive_navigation:main"
active-inference-meta-navigation-gif = "active_inference_meta.adaptive_animation:main"
active-inference-meta-ros = "active_inference_meta.ros_runtime:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Diluna98/active-inference-with-meta-inference"
Repository = "https://github.com/Diluna98/active-inference-with-meta-inference"
Issues = "https://github.com/Diluna98/active-inference-with-meta-inference/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
active_inference_meta = ["data/*.json", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
